server:
  port: 8080

spring:
  application:
    name: demo

  # MySQL 连接：默认 localhost:3306/harmony_test，账号 root
  # 密码不写进仓库，启动时用环境变量传入：DB_PASSWORD=你的密码
  # 数据库和表需要先执行 db/init.sql 手动创建，应用启动时不会改数据库
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/harmony_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 66163905aa

  # 声纹注册/打卡都是 multipart/form-data
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB

mybatis-plus:
  configuration:
    # 数据库下划线字段 -> Java 驼峰属性，例如 user_name -> userName
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 逻辑删除：实体里叫 deleted 的字段自动生效
      # 查询会自动追加 deleted = 0；deleteById 会变成 UPDATE deleted = 1
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 自定义配置：Token 有效期（分钟），在 TokenStore 里用 @Value 读取
# 注意这里必须是纯数字，写成 60*24 会被当成字符串，启动时转 long 直接报错
app:
  auth:
    token-expire-minutes: 1440

  voiceprint:
    # 音频根目录；换机器时不用改代码，设置 VOICEPRINT_AUDIO_ROOT 即可
    audio-root: D:/a2026-10/attendance-voice
    # Base64 编码的 32 字节 AES 密钥；生成：openssl rand -base64 32
    # 不配置时 M1/M2 仍可启动，真正使用加密时（M3）会校验
    aes-key: q8Zr2pLx9vN4mK7wT1yB6cD3fH5jA0sE8gU2iO4kQ1o=
    challenge-ttl-seconds: 60
    challenge-max-attempts: 3
    challenge-rate-limit-per-minute: 5
    duplicate-threshold: 0.70
    thresholds:
      avg: 0.78
      min: 0.65
      margin: 0.05

# 自动接口文档：Swagger UI 地址 http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.example.demo: debug
    # MyBatis-Plus 在 debug 级别会打印实际执行的 SQL，方便联调
    com.example.demo.mapper: debug
